<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kurlekar Engineering Works | Global RFQ Desk for Precision Press Components</title>
  <meta name="description" content="Kurlekar Engineering Works manufactures precision sheet metal press components in Mumbai. Professional RFQ desk for global onboarding, components, tooling and production enquiries.">
  <meta name="theme-color" content="#b5121b">
  <meta property="og:title" content="Kurlekar Engineering Works">
  <meta property="og:description" content="Precision press components since 1995. Professional RFQ handling, sales support and global client onboarding.">
  <meta property="og:type" content="website">
  <style>
    :root {
      --bg: #070708;
      --panel: #101116;
      --panel-2: #191b22;
      --ink: #f8f3e6;
      --muted: #b2b0aa;
      --line: rgba(216, 181, 106, 0.16);
      --steel: #ece7dc;
      --steel-2: #b8a06a;
      --red: #8f1018;
      --red-2: #c91e2b;
      --teal: #50bdb2;
      --amber: #d8b56a;
      --green: #7bd28c;
      --gold: #d8b56a;
      --gold-2: #f2dda0;
      --platinum: #e8eaed;
      --charcoal: #0d0e12;
      --shadow: 0 28px 90px rgba(0, 0, 0, 0.48);
      --radius: 8px;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      background:
        linear-gradient(180deg, #070708 0%, #0d0d10 34%, #08090b 100%);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      background:
        radial-gradient(circle at 18% 0%, rgba(216, 181, 106, 0.14), transparent 28%),
        linear-gradient(115deg, rgba(143, 16, 24, 0.22), transparent 32%),
        radial-gradient(circle at 84% 12%, rgba(80, 189, 178, 0.12), transparent 30%),
        linear-gradient(180deg, #09090b 0%, #070708 100%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
      background-size: 96px 96px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.72), transparent 88%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page-shell {
      position: relative;
      z-index: 1;
    }
